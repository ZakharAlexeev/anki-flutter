name: CI

on:
  push:
    branches: [main]
    paths:
      - "anki_flutter/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "anki_flutter/**"
      - ".github/workflows/ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anki_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test
