name: Build unsigned iOS IPA

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "anki_flutter/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: anki_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"

      - run: flutter pub get

      - name: Prepare iOS project
        run: flutter build ios --release --no-codesign --config-only

      - name: Build Runner.app without code signing
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios_unsigned/Build/Products/Release-iphoneos/Runner.app Payload/
          /usr/bin/zip -qry anki_flutter-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: anki_flutter-unsigned-ipa
          path: anki_flutter/anki_flutter-unsigned.ipa
          retention-days: 30
